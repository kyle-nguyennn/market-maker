name: Hyperliquid SDK contract tests

on:
  push:
    branches: [perpetual-alpha-scaffold, feat/perpetual-alpha-phase-config]
    paths:
      - "exchanges/hyperliquid/**"
      - "market_handler/**"
      - "model/**"
      - "apps/**"
      - "config/**"
      - ".env.template"
      - "tests/**"
      - "requirements/**"
      - "environment*.yml"
      - ".github/workflows/hyperliquid-sdk-tests.yml"
  pull_request:
    paths:
      - "exchanges/hyperliquid/**"
      - "market_handler/**"
      - "model/**"
      - "apps/perpetual_alpha.py"
      - "tests/**"
      - "requirements/**"
      - "environment*.yml"
      - ".github/workflows/hyperliquid-sdk-tests.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/hyperliquid.txt
      - name: Install SDK and project test dependencies
        run: python -m pip install -r requirements/hyperliquid.txt
      - name: Verify Python module syntax
        run: python -m compileall -q exchanges market_handler model apps tests
      - name: Run offline SDK boundary tests
        run: python -m pytest -q
      - name: Run contract suite with scored DEX selected
        run: PERPETUAL_ALPHA_DEX=pa python -m pytest -q

  live-testnet-readonly:
    # Best-effort diagnostic: public market endpoints only, no account or keys.
    # A remote venue outage must not block deterministic offline contract tests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hyperliquid SDK
        run: python -m pip install -r requirements/hyperliquid.txt
      - name: Probe actual par DEX SDK REST endpoints (read only)
        run: |
          python - <<'PY'
          from exchanges.hyperliquid.client import HyperliquidVenueClient
          from market_handler.hyperliquid_adapter import HyperliquidMarketAdapter

          client = HyperliquidVenueClient()
          adapter = HyperliquidMarketAdapter()
          coin = "par:BTC"
          meta = client.query_meta()
          names = [item["name"] for item in meta["universe"]]
          assert coin in names, f"expected {coin} among par markets, got {names}"
          contexts = client.query_meta_and_asset_contexts()
          ctx_names = [item["name"] for item in contexts[0]["universe"]]
          assert coin in ctx_names, "metaAndAssetCtxs returned the wrong dex"
          book = client.query_l2_book("BTC")
          state = adapter.from_sdk_l2_snapshot(
              book, asset_ctx=contexts[1][ctx_names.index(coin)]
          )
          print("Live testnet response: dex=par, markets=", len(names))
          print("MarketState:", state.instrument, state.best_bid, state.best_ask,
                state.oracle_price, state.mark_price, "valid=", state.is_valid)
          print("No wallet queried; no signed request made.")
          PY

  scored-pa-readonly:
    # Read-only SDK integration probe: validate the selected pa profile against
    # the real testnet API. No account queries, wallet keys or trading actions.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK
        run: python -m pip install -r requirements/hyperliquid.txt
      - name: Probe pa SDK metadata, contexts, and book (read only)
        run: |
          python - <<'PY'
          from exchanges.hyperliquid.config import HyperliquidVenueConfig
          from exchanges.hyperliquid.client import HyperliquidVenueClient
          from market_handler.hyperliquid_adapter import HyperliquidMarketAdapter

          for dex in ("par", "pa"):
              config = HyperliquidVenueConfig.from_environment(dex=dex, environ={})
              client = HyperliquidVenueClient(config)
              adapter = HyperliquidMarketAdapter(config)
              meta = client.query_meta()
              names = [item["name"] for item in meta.get("universe", [])]
              coin = f"{dex}:BTC"
              assert coin in names, f"{coin} absent from {config.api_url}: {names}"
              contexts = client.query_meta_and_asset_contexts()
              indices = [item["name"] for item in contexts[0]["universe"]]
              assert coin in indices, f"{coin} absent from {dex} contexts"
              book = client.query_l2_book("BTC")
              state = adapter.from_sdk_l2_snapshot(
                  book, asset_ctx=contexts[1][indices.index(coin)]
              )
              print(
                  f"VALIDATED dex={dex} network={config.network} "
                  f"url={config.api_url} collateral={config.collateral} "
                  f"markets={len(names)} names={names} "
                  f"book_valid={state.is_valid} mid={state.mid}",
                  flush=True,
              )
              assert state.instrument == "BTC"
          print("No wallet queried; no signed actions performed.")
          PY
